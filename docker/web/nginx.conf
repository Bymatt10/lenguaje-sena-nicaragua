# Web de LSN detrás de Cloudflare Tunnel (TLS en el borde de Cloudflare).
# Sirve web/ y reenvía la API de contribuciones al contenedor lenguaje-api.
server {
    listen 80;
    server_name _;

    # resolución perezosa: nginx arranca aunque lenguaje-api aún no exista
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api http://lenguaje-api:5000;

    client_max_body_size 1m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # API de contribuciones (server.py)
    location ~ ^/(contribute|session|feedback|health)(/|$) {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # el modelo y las lecciones cambian con cada despliegue: siempre revalidar
    location ~ ^/(model/|words\.json|lessons\.json|signs_anim\.json|app\.js|style\.css|index\.html$) {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # clips del curso (montados desde el servidor, solo lectura)
    location ~ ^/(clips|demo)/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
