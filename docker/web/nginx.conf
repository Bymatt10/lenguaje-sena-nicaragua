# Web de LSN detrás de Cloudflare Tunnel + nginx-proxy-manager (ellos hacen TLS).
# Sirve web/ y reenvía la API de contribuciones al contenedor lenguaje-api.
server {
    listen 80;
    server_name _;

    # resolución perezosa: nginx arranca aunque lenguaje-api aún no exista
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api http://lenguaje-api:5000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: blob:; font-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https://cdn.jsdelivr.net; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    client_max_body_size 1m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # API de contribuciones (server.py)
    location ~ ^/(contribute|session|feedback|health)(/|$) {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # el modelo y las lecciones cambian con cada despliegue: siempre revalidar
    location ~ ^/(model/|words\.json|lessons\.json|signs_anim\.json|app\.js|style\.css|index\.html$) {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # clips del curso (montados desde el servidor, solo lectura)
    location ~ ^/(clips|demo)/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
